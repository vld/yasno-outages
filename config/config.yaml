yasno:
  city_id: !ENV ${REGION_ID:25}
  dso_id: !ENV ${DSO_ID:902}
  street_name: !ENV ${STREET_NAME}
  house_number: !ENV ${HOUSE_NUMBER}
  local_tz: "Europe/Kyiv"

outages_storage:
  type: file_storage
  path: !ENV ${FILE_PATH:./outages}

monitoring_storage:
  type: file_storage
  path: !ENV ${MONITORING_FILE_PATH:./monitoring}

notifier:
  type: telegram
  bot_token: !ENV ${TELEGRAM_BOT_TOKEN}
  chat_id: !ENV ${TELEGRAM_CHAT_ID}
  thread_id: !ENV ${TELEGRAM_THREAD_ID}

deye:
  app_id: !ENV ${DEYE_APP_ID}
  email: !ENV ${DEYE_EMAIL}
  password: !ENV ${DEYE_HASHED_PASSWORD}
  app_secret: !ENV ${DEYE_APP_SECRET}